name: Windows Build (Push)

on:
  push:
    branches:
      - master

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Cache NW.js
        uses: actions/cache@v4
        with:
          path: cache/
          key: nwjs-release-${{ runner.os }}-${{ hashFiles('gulpfile.js') }}

      - name: Prefetch NW.js
        shell: pwsh
        run: |
          $version = "0.72.0"
          $arch = "win-x64"
          $cacheDir = "cache/$version-normal"
          $zip = "nwjs-v$version-$arch.zip"
          New-Item -ItemType Directory -Force $cacheDir | Out-Null
          $dest = Join-Path $cacheDir $zip
          if (-Not (Test-Path $dest)) {
            $url = "https://dl.nwjs.io/v$version/$zip"
            $max = 3
            for ($i = 1; $i -le $max; $i++) {
              try {
                Write-Host "Downloading $url (attempt $i/$max)..."
                Invoke-WebRequest -Uri $url -OutFile $dest
                break
              } catch {
                if ($i -eq $max) { throw }
                Start-Sleep -Seconds 5
              }
            }
          }

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules/
          key: node_modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - run: yarn install --immutable --immutable-cache --check-cache

      - run: yarn gulp release --win64

      - name: Publish build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Betaflight-Configurator-Windows
          path: release/
          retention-days: 90
