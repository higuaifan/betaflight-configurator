name: Windows Build (Push)

on:
  push:
    branches:
      - master

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Cache NW.js
        uses: actions/cache@v4
        with:
          path: cache/
          key: nwjs-release-${{ runner.os }}-${{ hashFiles('gulpfile.js') }}

      - name: Prefetch NW.js
        shell: pwsh
        run: |
          $version = "0.72.0"
          $flavor = "normal"
          $plat = "win"
          $arch = "x64"
          $osName = "win64"
          $cacheRoot = "cache/$version-$flavor/$osName"
          $zip = "nwjs-v$version-$plat-$arch.zip"
          $releaseUrl = "https://github.com/higuaifan/betaflight-configurator/releases/download/nwjs-cache/$zip"
          New-Item -ItemType Directory -Force $cacheRoot | Out-Null
          $dest = Join-Path $cacheRoot $zip
          if (-Not (Test-Path $dest)) {
            $max = 3
            for ($i = 1; $i -le $max; $i++) {
              try {
                Write-Host "Downloading $releaseUrl (attempt $i/$max)..."
                Invoke-WebRequest -Uri $releaseUrl -OutFile $dest
                break
              } catch {
                if ($i -eq $max) { throw }
                Start-Sleep -Seconds 5
              }
            }
          }
          $extractPath = Join-Path $cacheRoot "nwjs-v$version-$plat-$arch"
          if (-Not (Test-Path (Join-Path $cacheRoot "nw.exe"))) {
            Write-Host "Extracting $dest..."
            Expand-Archive -Path $dest -DestinationPath $cacheRoot
            if (Test-Path $extractPath) {
              Get-ChildItem -Path $extractPath -Force | Move-Item -Destination $cacheRoot -Force
              Remove-Item -Path $extractPath -Recurse -Force
            }
          }
          if (Test-Path $dest) {
            Remove-Item -Path $dest -Force
          }

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules/
          key: node_modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - run: yarn install --immutable --immutable-cache --check-cache

      - run: yarn gulp release --win64

      - name: Publish build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Betaflight-Configurator-Windows
          path: release/
          retention-days: 90
